name: Build RCOS Mobile APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract RCOS project
        run: |
          mkdir extracted
          unzip -q RCOS-Mobile-Build-Ready.zip -d extracted

      - name: Locate and build RCOS APK
        run: |
          PROJECT=$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)
          echo "Building project at: $PROJECT"
          cd "$PROJECT"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCOS-Mobile-Debug-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
