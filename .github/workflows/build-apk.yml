
name: Build RCOS 3.0 Mobile APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build RCOS 3.0 Web Application (Vite)
        run: npm run build

      - name: Sync Web Application into Android Assets
        run: |
          echo "Syncing latest RCOS 3.0 web app into Android assets..."
          mkdir -p android/rcos-mobile-fixed/app/src/main/assets
          rm -rf android/rcos-mobile-fixed/app/src/main/assets/*
          cp -r dist/* android/rcos-mobile-fixed/app/src/main/assets/
          echo "Assets sync verified:"
          ls -la android/rcos-mobile-fixed/app/src/main/assets/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/rcos-mobile-fixed/gradlew

      - name: Build RCOS 3.0 Debug APK from source
        working-directory: android/rcos-mobile-fixed
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          echo "Verifying generated APK:"
          ls -la app/build/outputs/apk/debug/

      - name: Upload RCOS 3.0 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RCOS-3.0-Mobile-Debug-APK
          path: android/rcos-mobile-fixed/app/build/outputs/apk/debug/*.apk
          retention-days: 14
