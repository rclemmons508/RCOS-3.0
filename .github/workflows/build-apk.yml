name: Build RCOS 3.0 Mobile APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build RCOS 3.0 Web Application
        run: npm run build

      - name: Sync Web Application into Android Assets
        run: |
          echo "Syncing latest RCOS 3.0 web application..."
          mkdir -p android/rcos-mobile-fixed/app/src/main/assets
          rm -rf android/rcos-mobile-fixed/app/src/main/assets/*
          cp -r dist/* android/rcos-mobile-fixed/app/src/main/assets/
          rm -f android/rcos-mobile-fixed/app/src/main/assets/server.cjs*
          echo "Assets successfully copied."
          ls -la android/rcos-mobile-fixed/app/src/main/assets/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses & install packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Verify Android SDK
        run: |
          echo "Android SDK location:"
          echo "$ANDROID_HOME"
          echo ""
          echo "Installed SDK packages:"
          sdkmanager --list_installed || true
          echo ""
          echo "ADB version:"
          adb --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/rcos-mobile-fixed/gradlew

      - name: Verify Gradle wrapper
        working-directory: android/rcos-mobile-fixed
        run: ./gradlew --version

      - name: Build RCOS 3.0 Debug APK
        working-directory: android/rcos-mobile-fixed
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          echo "Searching for generated APK files..."
          find android/rcos-mobile-fixed/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print
          echo ""
          echo "Debug APK directory:"
          ls -lah android/rcos-mobile-fixed/app/build/outputs/apk/debug/

      - name: Upload RCOS 3.0 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RCOS-3.0-Mobile-Debug-APK
          path: android/rcos-mobile-fixed/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
